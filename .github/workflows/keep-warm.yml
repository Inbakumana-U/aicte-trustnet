name: Keep API warm

on:
  schedule:
    # Render free web services sleep after 15 minutes idle; ping every 10.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          API_BASE: ${{ vars.TRUSTNET_API_BASE || 'https://aicte-trustnet-api.onrender.com' }}
        run: curl -fsS --max-time 120 "$API_BASE/api/v1/health"
